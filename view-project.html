<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects List</title>
  <style>
    /* shared site header styles (matches index.html) */
    .site-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#ffffff;border-bottom:1px solid #e6e9ef;border-radius:6px}
    .site-header .brand h1{font-size:20px;margin:0;color:#1f2a44}
    .site-nav{display:flex;gap:10px;align-items:center}
    .site-nav .nav-link{padding:8px 12px;text-decoration:none;border-radius:6px;color:#0366d6;font-weight:600;background:transparent}
    .site-nav .nav-link:hover{background:#f0f6ff}
    @media(max-width:600px){.site-header{flex-direction:column;gap:8px;align-items:flex-start}}
    html, body {
      margin: 0; padding: 1rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #2e3a59;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
      color: #1f2a44;
      letter-spacing: 0.02em;
    }

    .table-container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      overflow-x: auto;
      padding: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      color: #44566c;
    }

    thead {
      background-color: #4a90e2;
      color: #fff;
      user-select: none;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e3eaf1;
      text-align: left;
      vertical-align: middle;
    }

    tbody tr:hover {
      background-color: #f0f5fc;
    }

    /* Status badges */
    .status {
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      color: rgb(21, 8, 8);
      display: inline-block;
      user-select: none;
    }

    .status.NotStarted { background-color: #aab4be; }
    .status.InProgress { background-color: #4a90e2; }
    .status.OnHold { background-color: #f39c12; }
    .status.Completed { background-color: #27ae60; }
    .status.Cancelled { background-color: #e74c3c; }

    /* Duplicate project highlight */
    .duplicate-row {
      background-color: #ffe6e6 !important;
      border-left: 4px solid #e74c3c;
    }

    /* Action buttons */
    .actions a {
      text-decoration: none;
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      margin-right: 0.4rem;
      transition: background-color 0.2s ease;
      user-select: none;
      display: inline-block;
    }

    .actions a.view {
      background-color: #27ae60;
    }
    .actions a.view:hover {
      background-color: #219150;
    }

    .actions a.edit {
      background-color: #4a90e2;
    }
    .actions a.edit:hover {
      background-color: #357abd;
    }

    /* Responsive */
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead tr {
        display: none;
      }
      tbody tr {
        margin-bottom: 1rem;
        border-bottom: 2px solid #ddd;
        padding-bottom: 0.5rem;
      }
      tbody td {
        padding-left: 50%;
        position: relative;
        border-bottom: 1px solid #eee;
      }
      tbody td::before {
        position: absolute;
        top: 50%;
        left: 1rem;
        width: 45%;
        padding-right: 1rem;
        white-space: nowrap;
        transform: translateY(-50%);
        font-weight: 600;
        color: #44566c;
      }
      tbody td:nth-of-type(1)::before { content: "Project Name"; }
      tbody td:nth-of-type(2)::before { content: "Start Date"; }
      tbody td:nth-of-type(3)::before { content: "End Date"; }
      tbody td:nth-of-type(4)::before { content: "Tags"; }
      tbody td:nth-of-type(5)::before { content: "Status"; }
      tbody td:nth-of-type(6)::before { content: "Actions"; }
    }
  </style>
</head>
<body>

  <header class="site-header" style="margin-bottom:12px">
    <div class="brand"><h1 style="font-size:18px;margin:0">Project Manager</h1></div>
    <nav class="site-nav">
      <a class="nav-link" href="view-project.html">Home</a>
      <a class="nav-link" href="index.html">Create Project</a>
      <a class="nav-link" href="milestone.html">View Milestones</a>
    </nav>
  </header>
  <h1>Projects List</h1>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="cursor:pointer" onclick="sortTable('name')">Project Name ↕</th>
          <th style="cursor:pointer" onclick="sortTable('startDate')">Start Date ↕</th>
          <th style="cursor:pointer" onclick="sortTable('endDate')">End Date ↕</th>
          <th style="cursor:pointer" onclick="sortTable('tags')">Tags ↕</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="projectsTbody">
        <!-- JavaScript will populate rows from localStorage -->
      </tbody>
    </table>
  </div>

  <script>
    const STORAGE_KEY = 'myProjects';
    const MILESTONE_KEY = 'myMilestones';
    let allProjects = [];
    let sortBy = 'name';

    function escapeHtml(s){
      return String(s || '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    function statusClass(status){
      if(!status) return '';
      return status.replace(/\s+/g,'');
    }

    function loadMilestones(){
      try{
        const raw = localStorage.getItem(MILESTONE_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }

    function sortTable(field){
      sortBy = field;
      renderProjects();
    }

    function getSortedProjects(projects){
      const sorted = [...projects];
      if(sortBy === 'name'){
        sorted.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      } else if(sortBy === 'startDate'){
        sorted.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
      } else if(sortBy === 'endDate'){
        sorted.sort((a, b) => (a.dueDate || a.endDate || '').localeCompare(b.dueDate || b.endDate || ''));
      } else if(sortBy === 'tags'){
        sorted.sort((a, b) => (a.tag || '').localeCompare(b.tag || ''));
      }
      return sorted;
    }

    function findDuplicates(projects){
      const duplicates = new Set();
      // Check for same name
      const nameMap = {};
      projects.forEach(p => {
        const name = (p.name || p.projectName || '').toLowerCase();
        if(name){
          if(nameMap[name]){
            duplicates.add(nameMap[name].id);
            duplicates.add(p.id);
          } else {
            nameMap[name] = p;
          }
        }
      });
      // Check for same tag + startDate + endDate
      const dateTagMap = {};
      projects.forEach(p => {
        const key = `${p.tag || ''}|${p.startDate || ''}|${p.dueDate || p.endDate || ''}`;
        if(key !== '||'){
          if(dateTagMap[key]){
            duplicates.add(dateTagMap[key].id);
            duplicates.add(p.id);
          } else {
            dateTagMap[key] = p;
          }
        }
      });
      return duplicates;
    }

    function renderProjects(){
      const raw = localStorage.getItem(STORAGE_KEY);
      const projects = raw ? JSON.parse(raw) : [];
      const tbody = document.getElementById('projectsTbody');
      if(!projects || projects.length === 0){
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:1rem">No projects found</td></tr>';
        return;
      }

      allProjects = projects;
      const sorted = getSortedProjects(projects);
      const milestones = loadMilestones();
      const duplicates = findDuplicates(projects);
      
      if(duplicates.size > 0){
        const dupNames = projects
          .filter(p => duplicates.has(p.id))
          .map(p => p.name || p.projectName)
          .join(', ');
        alert('⚠️ Duplicate projects detected: ' + dupNames);
      }

      tbody.innerHTML = sorted.map(p => {
        const related = milestones.filter(m => String(m.projectId) === String(p.id));
        const total = related.length;
        const done = related.filter(m => m.completed).length;
        const milestoneHTML = total > 0 ? `${done}/${total} milestones complete` : '';
        const status = escapeHtml(p.status || '');
        const rowClass = duplicates.has(p.id) ? 'duplicate-row' : '';
        return `
          <tr class="${rowClass}">
            <td>${escapeHtml(p.name || p.projectName || '')}</td>
            <td>${escapeHtml(p.startDate || '')}</td>
            <td>${escapeHtml(p.dueDate || p.endDate || '')}</td>
            <td>${escapeHtml(p.tag || '')}</td>
            <td>
              <span class="status ${statusClass(status)}">${status || '—'}</span>
              ${milestoneHTML ? `<div style="font-size:12px;color:#44566c;margin-top:6px">${escapeHtml(milestoneHTML)}</div>` : ''}
            </td>
            <td class="actions">
              <a href="#" class="view" onclick="openProject('${p.id}')">Edit</a>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openProject(id){
      try{
        localStorage.setItem('openProjectId', String(id));
      }catch(e){}
      window.location.href = 'index.html';
    }

    window.addEventListener('storage', (e) => {
      if(e.key === STORAGE_KEY || e.key === MILESTONE_KEY) renderProjects();
    });

    document.addEventListener('DOMContentLoaded', renderProjects);
  </script>

</body>
</html>
